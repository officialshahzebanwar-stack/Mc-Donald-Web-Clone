<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.contact-container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    border-top:8px solid #ffbc0d;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:black;
}

.contact-info{
    margin-bottom:30px;
}

.contact-info p{
    margin:10px 0;
    color:#444;
    font-size:16px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

label{
    font-weight:600;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#ffbc0d;
}

button{
    background:white;
    color:black;
    border:2px solid black;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:black;
    color:white;
}

.social-links{
    margin-top:30px;
    text-align:center;
}

.social-links a{
    text-decoration:none;
    color:black;
    margin:0 10px;
    font-weight:600;
}

.social-links a:hover{
    color:#ffbc0d;
}

</style>
</head>
<body>
   <div class="contact-container">
    <h1>Contact Us</h1>

<p>We'd love to hear from you!</p>

<p><strong>Phone:</strong> +92 300 1234567</p>
<p><strong>Email:</strong> support@mcdonalds.com</p>
<p><strong>Address:</strong> Main Shahrah-e-Faisal, Karachi, Pakistan</p>

<form>
    <label>Name:</label>
    <input type="text">

    <label>Email:</label>
    <input type="email">

    <label>Message:</label>
    <textarea rows="5"></textarea>

    <button type="submit">Send Message</button>
    </div>
</form>
<script>

const form = document.querySelector("form");

form.addEventListener("submit", function(e){

    e.preventDefault();

    alert("Thank you! Your message has been sent successfully.");

    form.reset();

});

</script>
</body>
</html>
