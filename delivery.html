<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Delivery</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background: white;
            padding: 20px 50px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            width: 120px;
        }

        /* MAIN */

        .container {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px;
        }

        .left {
            max-width: 450px;
        }

        .left h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #222;
        }

        .left p {
            margin-top: 15px;
            color: #555;
            line-height: 1.7;
        }

        /* INPUT */

        .address-box {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
            font-size: 16px;
        }

        .address-box:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 188, 13, .4);
        }

        /* BUTTON */

        .find-btn {
            margin-top: 20px;
            background: white;
            color: black;
            border: 2px solid black;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: .3s;
        }

        .find-btn:hover {
            background: black;
            color: white;
        }

        /* IMAGE */

        .right img {
            width: 320px;
            opacity: .8;
        }

        /* FOOTER */

        footer {
            background: white;
            border-top: 1px solid #ddd;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            display: flex;
            gap: 20px;
        }

        .footer-left a {
            text-decoration: none;
            color: #333;
        }

        .footer-left a:hover {
            color: #ffbc0d;
        }

        .footer-right {
            color: #555;
        }

        /* MOBILE */

        @media(max-width:900px) {

            .container {
                flex-direction: column;
                text-align: center;
                gap: 40px;
                padding: 40px 20px;
            }

            .right img {
                width: 220px;
            }

            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

        }
    </style>
</head>

<body>

    <header>
        <img src="/img/logo.png" alt="McDonald's Logo" class="logo">
    </header>

    <main>

        <div class="container">

            <div class="left">

                <h1>Start Your Delivery Order</h1>

                <input type="text" class="address-box" id="address" placeholder="📍 Enter delivery address">

                <p>
                    We'll find the nearest McDonald's restaurant
                    that can deliver to your location.
                </p>

                <button class="find-btn" id="findBtn">
                    Find Restaurant
                </button>

            </div>

            <div class="right">
                <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" alt="Map">
            </div>

        </div>

    </main>

    <footer>

        <div class="footer-left">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </div>

        <div class="footer-right">
            © 2026 McDonald's. All Rights Reserved.
        </div>

    </footer>

    <script>

        const findBtn = document.getElementById("findBtn");

        findBtn.addEventListener("click", function () {

            const address =
                document.getElementById("address").value;

            if (address.trim() === "") {

                alert("Please enter your delivery address.");

                return;
            }

            alert(
                "Searching nearest McDonald's near: "
                + address
            );

        });

    </script>

</body>

</html>
```
