<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald’s Email Signup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 40px;
        }

        /* FORM */

        form {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
            border-top: 8px solid #ffbc0d;
        }

        /* HEADINGS */

        .form-title {
            font-size: 40px;
            color: black;
            margin-bottom: 10px;
        }

        .form-subtitle {
            font-size: 28px;
            color: #ffbc0d;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        form p {
            color: #444;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* FIELDS */

        form div {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: black;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: .3s;
        }

        input:focus {
            outline: none;
            border-color: #ffbc0d;
        }

        /* BUTTON */

        button {
            background: white;
            color: black;
            border: 2px solid black;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: black;
            color: white;
        }

        /* RESPONSIVE */

        @media(max-width:768px) {

            form {
                padding: 25px;
            }

            .form-title {
                font-size: 30px;
            }

            .form-subtitle {
                font-size: 22px;
            }

        }
    </style>
</head>

<body>
    <form action="" method="post">
        <h1 class="form-title">McDonald’s Email Sign in</h1>
        <h2 class="form-subtitle">sign in</h2>
        <p>Be in the know about deals, MyMcDonald’s Rewards, news and more by signing in for our emails.</p>
        <p>* Indicates a required field</p>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <p>
            *please wait for few moments we send you a verification code to your email address. Please enter the code to
            complete the sign-in process.
        </p>
        <button type="submit">Sign In</button>
    </form>
</body>

</html>
